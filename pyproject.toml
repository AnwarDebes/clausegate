[project]
name = "clausegate"
version = "0.1.0"
description = "Interpretable verification of LLM agent tool calls via tri-graph Tsetlin Machines with SAT-verifiable receipts and counterfactual argument recourse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "Tsetlin Machine",
    "Graph Tsetlin Machine",
    "LLM agent safety",
    "Model Context Protocol",
    "MCP",
    "tool-call verification",
    "prompt injection",
    "interpretable AI",
    "SAT verification",
    "counterfactual recourse",
    "EU AI Act",
    "OWASP LLM Top 10",
    "MITRE ATLAS",
    "neuro-symbolic",
]
authors = [
    { name = "Anwar (University of Agder)" }
]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
tm = [
    "GraphTsetlinMachine>=0.3.3",
    "tmu>=0.8.3",
]
sat = [
    "python-sat>=1.8.dev14",
]
agentdojo = [
    "agentdojo>=0.1.0",
]
baselines = [
    "torch>=2.6",
    "transformers>=4.50",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
full = [
    "GraphTsetlinMachine>=0.3.3",
    "tmu>=0.8.3",
    "python-sat>=1.8.dev14",
    "agentdojo>=0.1.0",
    "torch>=2.6",
    "transformers>=4.50",
    "pytest>=8.0",
]

[project.urls]
Source = "https://github.com/<your-org>/clausegate"
Citation = "./CITATION.cff"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

# Install instructions:
#   pip install -e .              # classic
#   uv pip install -e .           # ~10-100x faster (recommended)
#   uv pip sync requirements.txt  # exact-pinned reproduction
#
# For the GPU build of PyTorch:
#   pip install -e ".[full]" --index-url https://download.pytorch.org/whl/cu126
